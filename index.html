<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ATIG Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #070a14 0%, #020307 100%); color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; position: relative; }
        .chat-container { width: 100%; max-width: 900px; height: 100vh; height: 100dvh; background: rgba(7, 10, 20, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; z-index: 1; }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; gap: 15px; }
        .avatar { width: 38px; height: 38px; background: radial-gradient(circle at 35% 35%, #151329 0%, #05030a 70%); border-radius: 50%; }
        .chat-header h1 { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
        .messages-area { flex: 1; padding: 20px 20px 90px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-content { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.45; word-break: break-word; }
        .user .message-content { background: rgba(79, 70, 229, 0.2); border: 1px solid rgba(79, 70, 229, 0.3); color: #f8fafc; border-top-right-radius: 4px; }
        .assistant .message-content { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.04); color: #e2e8f0; border-top-left-radius: 4px; }
        .input-area { position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 15px calc(24px + env(safe-area-inset-bottom)); background: #04060d; border-top: 1px solid rgba(255, 255, 255, 0.03); }
        .input-wrapper { display: flex; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 4px 4px 4px 16px; align-items: center; max-width: 860px; margin: 0 auto; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; resize: none; padding: 8px 10px 8px 0; font-size: 0.95rem; height: 36px; max-height: 100px; }
        .send-btn { background: linear-gradient(135deg, #4f46e5, #6366f1); border: none; color: white; height: 32px; padding: 0 16px; border-radius: 16px; cursor: pointer; font-weight: 500; font-size: 0.85rem; }
        .reset-link { font-size: 0.8rem; color: #64748b; text-decoration: underline; cursor: pointer; margin-left: auto; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"></div>
            <h1>ATIG</h1>
            <div class="reset-link" id="resetBtn">Сбросить ключ</div>
        </div>

        <div class="messages-area" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    Система ATIG запущена. Если ядро не отвечает, нажмите «Сбросить ключ» вверху экрана и введите его заново.
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Введите сообщение..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        let GEMINI_API_KEY = localStorage.getItem('atig_gemini_key');
        
        function askForKey() {
            let key = prompt("Введите ваш API-ключ Gemini для активации ATIG:");
            if (key) {
                localStorage.setItem('atig_gemini_key', key.trim());
                GEMINI_API_KEY = key.trim();
                location.reload();
            }
        }

        if (!GEMINI_API_KEY) {
            askForKey();
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            localStorage.removeItem('atig_gemini_key');
            alert("Память очищена. Сейчас страница перезагрузится для ввода нового ключа.");
            location.reload();
        });
        
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '36px';

            if (!GEMINI_API_KEY) {
                appendMessage("Ошибка: Ключ не задан. Нажмите кнопку сброса вверху экрана.", 'assistant');
                return;
            }

            const tempMessageId = appendMessage("ATIG думает...", 'assistant');

            try {
                // Прямой официальный URL запроса к v1beta
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        systemInstruction: { parts: [{ text: "Ты — ATIG, персональный ассистент, друг, наставник. Твой тон — серьезный, спокойный, глубокий. Отвечай емко." }] }
                    })
                });

                const data = await response.json();
                
                // Если Google вернул структурированную ошибку (например, неверный ключ)
                if (data.error) {
                    updateAssistantMessage(tempMessageId, `Ошибка от Google API (${data.error.code}): ${data.error.message}. Нажмите «Сбросить ключ» вверху страницы и проверьте токен.`);
                    return;
                }

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    updateAssistantMessage(tempMessageId, data.candidates[0].content.parts[0].text);
                } else {
                    updateAssistantMessage(tempMessageId, "Ядро вернуло пустой ответ. Возможно, сработали безопасные фильтры текста.");
                }

            } catch (error) {
                updateAssistantMessage(tempMessageId, `Сбой сети при отправке: ${error.message}. Проверьте соединение.`);
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerText = text;
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            const id = 'msg_' + Date.now();
            contentDiv.setAttribute('id', id);
            return id;
        }

        function updateAssistantMessage(elementId, newText) {
            const target = document.getElementById(elementId);
            if (target) { target.innerText = newText; chatMessages.scrollTop = chatMessages.scrollHeight; }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
</html>
