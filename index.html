<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIG — Artificial Trusted Intelligence Guardian</title>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #12161f;
            --accent-blue: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #21262d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Мобильная адаптация сайдбара */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        .top-nav {
            background: var(--panel-bg);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            white-space: nowrap;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }

        /* Атом */
        .atom-container { position: relative; width: 70px; height: 70px; margin: 10px auto; }
        .nucleus { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: var(--accent-blue); border-radius: 50%; box-shadow: 0 0 12px var(--accent-blue); }
        .ring { position: absolute; width: 100%; height: 100%; border: 2px solid var(--accent-blue); border-radius: 50%; border-top-color: transparent; border-bottom-color: transparent; box-shadow: 0 0 8px var(--accent-glow); }
        .ring-1 { transform: rotateX(65deg) rotateY(0deg); animation: spin1 4s linear infinite; }
        .ring-2 { transform: rotateX(65deg) rotateY(60deg); animation: spin2 4s linear infinite; }
        .ring-3 { transform: rotateX(65deg) rotateY(120deg); animation: spin3 4s linear infinite; }

        @keyframes spin1 { 0% { transform: rotateX(65deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(0deg) rotateZ(360deg); } }
        @keyframes spin2 { 0% { transform: rotateX(65deg) rotateY(60deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(60deg) rotateZ(360deg); } }
        @keyframes spin3 { 0% { transform: rotateX(65deg) rotateY(120deg) rotateZ(0deg); } 100% { transform: rotateX(65deg) rotateY(120deg) rotateZ(360deg); } }

        .title { text-align: center; font-size: 1.4rem; color: var(--text-main); margin-top: 5px; }
        .subtitle { text-align: center; font-size: 0.75rem; color: var(--text-muted); }

        .chat-container { flex: 1; margin: 15px 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
        .message { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; font-size: 0.9rem; text-align: center; color: var(--text-muted); }

        /* Нижняя панель */
        .input-wrapper { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 25px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
        textarea { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem; resize: none; height: 24px; }
        .btn { background: transparent; border: none; color: var(--accent-blue); font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Верхняя мобильная панель -->
        <nav class="top-nav">
            <button class="nav-btn">💬 Новый чат</button>
            <button class="nav-btn">🧠 Память</button>
            <button class="nav-btn">📂 Проекты</button>
            <button class="nav-btn">🎙 Голос</button>
            <button class="nav-btn">⚙ Настройки</button>
        </nav>

        <main class="main-content">
            <header>
                <div class="atom-container">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="nucleus"></div>
                </div>
                <h1 class="title">ATIG</h1>
                <p class="subtitle">Artificial Trusted Intelligence Guardian</p>
            </header>

            <section class="chat-container">
                <div class="message">
                    Здравствуйте, Максим. Система ATIG готова к работе. Чем занимаемся сегодня?
                </div>
            </section>

            <footer>
                <div class="input-wrapper">
                    <button class="btn">🎤</button>
                    <button class="btn">📎</button>
                    <textarea placeholder="Введите задачу..."></textarea>
                    <button class="btn">➤</button>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
