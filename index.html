<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIG — Artificial Trusted Intelligence Guardian</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="brand-header">
                <h2>ATIG</h2>
                <span class="status-indicator"><span class="dot"></span> ONLINE</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active">💬 Новый чат</button>
                <button class="nav-btn">🧠 Память</button>
                <button class="nav-btn">📂 Проекты</button>
                <button class="nav-btn">🎙 Голос</button>
                <button class="nav-btn">⚙ Настройки</button>
            </nav>
        </aside>

        <!-- Основная область -->
        <main class="main-content">
            <!-- Шапка с Живым Ядром -->
            <header class="atig-header">
                <div class="atom-container" id="atigAtom">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="nucleus"></div>
                </div>
                <h1 class="title">ATIG</h1>
                <p class="subtitle">Artificial Trusted Intelligence Guardian</p>
            </header>

            <!-- Чат-контейнер -->
            <section class="chat-container" id="chatContainer">
                <div class="message system-message">
                    Здравствуйте, Максим. Система ATIG готова к работе. Чем занимаемся сегодня?
                </div>
            </section>

            <!-- Нижняя панель ввода -->
            <footer class="input-container">
                <div class="input-wrapper">
                    <button class="icon-btn" id="voiceBtn" title="Голосовой ввод">🎤</button>
                    <button class="icon-btn" id="attachBtn" title="Прикрепить файл">📎</button>
                    <textarea id="userInput" rows="1" placeholder="Введите задачу или сообщение..."></textarea>
                    <button class="send-btn" id="sendBtn" title="Отправить">➤</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
