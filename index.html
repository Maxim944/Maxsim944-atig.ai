<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATIG Assistant</title>
    <style>
        /* Базовые настройки темы ATIG */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #070a14 0%, #020307 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Сдержанная фоновая сетка, намек на структуру */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 40px);
            background-size: 40px 40px;
            opacity: 0.5;
            z-index: 0;
        }

        /* Контейнер чата (адаптирован под мобильные и десктоп) */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            background: rgba(7, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .chat-container {
                height: 90vh;
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 24px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            }
        }

        /* Шапка ассистента */
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ЖИВАЯ СФЕРА ATIG: Строгая, глубокая сингулярность */
        .avatar {
            width: 38px;
            height: 38px;
            position: relative;
            background: radial-gradient(circle at 35% 35%, #151329 0%, #05030a 70%, #000000 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 15px rgba(99, 102, 241, 0.12),
                inset 0 0 6px rgba(255, 255, 255, 0.05);
            animation: spherePulse 4s ease-in-out infinite alternate;
        }

        .avatar::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 75%);
            filter: blur(1px);
        }

        @keyframes spherePulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 12px rgba(99, 102, 241, 0.1), inset 0 0 6px rgba(255, 255, 255, 0.05);
            }
            100% {
                transform: scale(1.04);
                box-shadow: 0 0 22px rgba(139, 92, 246, 0.2), inset 0 0 8px rgba(255, 255, 255, 0.08);
            }
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f1f5f9;
        }

        /* Область вывода сообщений */
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        /* Сообщения */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
        }

        .user .message-content {
            background: rgba(79, 70, 229, 0.2);
            border: 1px solid rgba(79, 70, 229, 0.3);
            color: #f8fafc;
            border-top-right-radius: 4px;
        }

        .assistant .message-content {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            border-top-left-radius: 4px;
        }

        /* Зона ввода */
        .input-area {
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom));
            background: transparent;
        }

        .input-wrapper {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 4px 4px 4px 16px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            resize: none;
            padding: 10px 10px 10px 0;
            font-size: 0.95rem;
            height: 40px;
            max-height: 120px;
        }

        textarea::placeholder {
            color: #475569;
        }

        .send-btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border: none;
            color: white;
            height: 36px;
            padding: 0 20px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"></div>
            <h1>ATIG</h1>
        </div>

        <div class="messages-area" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    Система ATIG запущена и готова к работе. Какую задачу решим в первую очередь?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Введите сообщение..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        // Автоматическое расширение текстового поля при вводе
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '40px';

            // Пока бэкенд не подключен — временная заглушка
            setTimeout(() => {
                appendMessage("Интерфейс работает стабильно. Ожидаю подключения логики и API Gemini.", 'assistant');
            }, 1000);
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerText = text;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
