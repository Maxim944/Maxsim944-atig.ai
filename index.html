<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ATIG // Neural AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #05060b;
      --panel-bg: rgba(18, 20, 32, 0.75);
      --panel-border: rgba(212, 175, 55, 0.2);
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.12);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --nebula-purple: rgba(88, 28, 135, 0.22);
      --nebula-blue: rgba(30, 58, 138, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Space Grotesk', sans-serif; color: var(--text-main); background: var(--bg-deep); }

    /* Космический фон как на скрине Grok/GPT */
    .galaxy-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(circle at 50% 20%, var(--nebula-purple) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, var(--nebula-blue) 0%, transparent 60%),
        linear-gradient(180deg, #030308 0%, #080914 100%);
    }

    /* Главный макет (Mobile First) */
    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Поддержка мобильных браузеров */
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 16px;
      position: relative;
    }

    /* 1. ВЕРХНЯЯ ШАПКА (HEADER) */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      z-index: 10;
    }

    .header-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      display: grid;
      place-items: center;
      color: var(--text-main);
      cursor: pointer;
    }

    /* Переключатель режимов по центру (Спросить / Память / Наследие) */
    .top-mode-tabs {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .mode-tab {
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 4px;
      transition: all 0.2s;
    }

    .mode-tab.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--gold);
    }

    .login-btn {
      background: #ffffff;
      color: #000000;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    /* 2. ЦЕНТРАЛЬНАЯ ЧАСТЬ (HERO) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 0;
      gap: 24px;
      overflow-y: auto;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    /* Логотип-сфера ATIG по центру */
    .atig-orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold) 60%, #000);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      margin-bottom: 8px;
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(212, 175, 55, 0.4); }
    }

    /* 3. КНОПКИ-ЧИПСЫ ПОДСКАЗОК (Как на скрине Grok/ChatGPT) */
    .chips-scroll {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none; /* Скрыть скроллбар */
    }
    .chips-scroll::-webkit-scrollbar { display: none; }

    .chip-btn {
      white-space: nowrap;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .chip-btn.highlight {
      background: rgba(212, 175, 55, 0.12);
      border-color: var(--panel-border);
      color: var(--gold-light);
    }

    /* 4. ГЛАВНОЕ ПОЛЕ ВВОДА (PROMPT BOX) */
    .prompt-container {
      width: 100%;
      margin-bottom: 8px;
    }

    .prompt-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
    }

    .prompt-box textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      resize: none;
      max-height: 120px;
    }
    .prompt-box textarea::placeholder { color: var(--text-muted); }

    .prompt-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prompt-controls-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attach-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* Селектор модели (Qwen / Grok / ATIG Core) */
    .model-selector-chip {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--panel-border);
      color: var(--gold-light);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-family: 'Fira Code', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .prompt-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: grid;
      place-items: center;
      font-weight: bold;
      cursor: pointer;
    }

    /* 5. ПОДВАЛ / ЮРИДИЧЕСКИЙ ТЕКСТ (Как у ChatGPT/Grok) */
    .disclaimer {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-align: center;
      padding: 8px 0;
    }
    .disclaimer a { color: var(--text-muted); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="galaxy-bg"></div>

  <div class="app-viewport">
    
    <!-- ВЕРХНЯЯ ШАПКА -->
    <header class="app-header">
      <div class="header-icon-btn">≡</div>
      
      <div class="top-mode-tabs">
        <div class="mode-tab active">Спросить</div>
        <div class="mode-tab">Память</div>
        <div class="mode-tab">Наследие</div>
      </div>

      <button class="login-btn">Войти</button>
    </header>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
    <main class="main-content">
      <div class="atig-orb"></div>
      <h1 class="hero-title">Над чем вы работаете?</h1>
      
      <!-- Подсказки как на 1 и 2 скриншотах -->
      <div class="chips-scroll">
        <div class="chip-btn highlight">✦ Попробуйте Qwen Core</div>
        <div class="chip-btn">🧬 Создать ядро памяти</div>
        <div class="chip-btn">⚡ Быстрый ответ</div>
      </div>
    </main>

    <!-- ФОКУСНАЯ СТРОКА ВВОДА (ВНИЗУ) -->
    <div class="prompt-container">
      <div class="prompt-box">
        <textarea rows="1" placeholder="Задайте любой вопрос ATIG..."></textarea>
        
        <div class="prompt-footer">
          <div class="prompt-controls-left">
            <div class="attach-btn">＋</div>
            <div class="model-selector-chip">⚡ Быстрый (Qwen 2.5) ∨</div>
          </div>

          <div class="prompt-controls-right">
            <div class="mic-btn">🎙</div>
            <button class="send-btn">↑</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ПОДВАЛ -->
    <footer class="disclaimer">
      ATIG — это ваш личный ИИ-архив памяти. <a href="#">Условия и политика</a>
    </footer>

  </div>

</body>
</html>
