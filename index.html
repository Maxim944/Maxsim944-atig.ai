<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIG - Deep Space Assistant</title>
    <style>
        /* Базовые настройки и тема Глубокого Космоса */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0b1021 0%, #04060d 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Эффект звездного неба на заднем плане */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.4;
            z-index: 0;
        }

        /* Основной контейнер чата (Полупрозрачный космический пластик) */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: rgba(11, 16, 33, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Шапка ассистента */
        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Область вывода сообщений */
        .messages-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

.avatar {
    width: 44px;
    height: 44px;
    position: relative;
    /* Глубокая темная основа сферы */
    background: radial-gradient(circle at 35% 35%, #1e1b4b 0%, #090514 70%, #020105 100%);
    border-radius: 50%;
    /* Мягкое космическое свечение вокруг */
    box-shadow: 
        0 0 20px rgba(99, 102, 241, 0.15),
        inset 0 0 8px rgba(255, 255, 255, 0.1);
    /* Анимация "дыхания" */
    animation: spherePulse 4s ease-in-out infinite alternate;
}

/* Эффект живой энергии внутри сферы */
.avatar::after {
    content: '';
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    border-radius: 50%;
    background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 80%);
    filter: blur(2px);
}

@keyframes spherePulse {
    0% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.15), inset 0 0 8px rgba(255, 255, 255, 0.1);
    }
    100% {
        transform: scale(1.03);
        /* В пике сфера чуть сильнее отдает глубоким спектром */
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.25), inset 0 0 12px rgba(255, 255, 255, 0.15);
    }
}


        /* Стилизация скроллбара под космос */
        .messages-area::-webkit-scrollbar {
            width: 6px;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* Сообщения */
        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .user .message-content {
            background: rgba(79, 70, 229, 0.25);
            border: 1px solid rgba(79, 70, 229, 0.4);
            color: #f8fafc;
            border-top-right-radius: 4px;
        }

        .assistant .message-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border-top-left-radius: 4px;
        }

        /* Зона ввода (Неоновая окантовка в стиле Gemini) */
        .input-area {
            padding: 20px 30px;
            background: transparent;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 5px 5px 5px 20px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            resize: none;
            padding: 12px 10px 12px 0;
            font-size: 1rem;
            height: 48px;
            max-height: 200px;
        }

        textarea::placeholder {
            color: #64748b;
        }

        .send-btn {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"></div>
            <h1>ATIG // SYSTEM</h1>
        </div>

        <div class="messages-area" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    Система инициализирована. Я готов помочь каждому человеку на Земле. С чего начнем создание нашей вселенной?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Введите сообщение..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        // Автоматическое расширение текстового поля при вводе
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Функция отправки сообщения (пока локальная эмуляция)
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Добавляем сообщение пользователя
            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '48px';

            // Эмуляция ответа (в будущем сюда подключим API Gemini)
            setTimeout(() => {
                appendMessage("Запрос принят. Модуль обработки космических масштабов находится в режиме ожидания интеграции API.", 'assistant');
            }, 1000);
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            contentDiv.innerText = text;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
