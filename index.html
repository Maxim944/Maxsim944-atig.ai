<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#040609">
  <meta name="description" content="ATIG Core — Прямой защищенный диалог с суверенным ИИ-спутником.">
  <title>ATIG // Диалоговое окно ИИ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #040609;
      --panel: rgba(10, 15, 25, 0.75);
      --panel-border: rgba(16, 185, 129, 0.3);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Фоновый космический канвас + стилизация под скриншот с кольцами */
    #space-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    .planet-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% -30%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 120%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      opacity: 0.9;
    }

    /* Верхняя панель навигации */
    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: rgba(4, 6, 9, 0.6);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--emerald); }

    .system-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 14px;
      border-radius: 100px;
      border: 1px solid var(--panel-border);
    }

    .status-dot {
      width: 6px; height: 6px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Центральная область чата */
    .chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 8px;
    }

    .message {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      backdrop-filter: blur(12px);
    }

    .message.ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.3));
      border: 1px solid var(--emerald);
      color: #fff;
    }

    /* Панель ввода запроса */
    .input-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 20px rgba(16, 185, 129, 0.1);
    }

    .input-panel input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-family: var(--font-sans);
      outline: none;
    }

    .input-panel input::placeholder { color: var(--text-muted); }

    .send-btn {
      background: var(--emerald);
      color: #04130e;
      border: none;
      width: 42px; height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
      box-shadow: 0 0 15px var(--emerald-glow);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--emerald-glow);
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>
  <div class="planet-bg"></div>

  <!-- ШАПКА -->
  <header>
    <a href="index.html" class="back-link">← На главную ATIG</a>
    <div class="system-status">
      <div class="status-dot"></div>
      <span>ATIG CORE // LOCAL ENCLAVE ACTIVE</span>
    </div>
  </header>

  <!-- ЧАТ -->
  <main class="chat-container">
    <div class="messages-area" id="chatMessages">
      <div class="message ai">
        Приветствую. Я ваш автономный ИИ-спутник ATIG. Локальный контур безопасности активен, память защищена. Какой вопрос или задачу решим сегодня?
      </div>
    </div>

    <div class="input-panel">
      <input type="text" id="userInput" placeholder="Введите команду или вопрос для ATIG..." autofocus>
      <button class="send-btn" id="sendBtn">↑</button>
    </div>
  </main>

  <!-- СКРИПТ ЗВЕЗД И ДИАЛОГА -->
  <script>
    // Звездный фон
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5,
        alpha: Math.random(),
        speed: Math.random() * 0.003 + 0.001
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // Логика отправки сообщений в чат
    const messagesArea = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      // Сообщение пользователя
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = text;
      messagesArea.appendChild(userMsg);
      userInput.value = '';
      messagesArea.scrollTop = messagesArea.scrollHeight;

      // Имитация ответа ИИ в закрытом контуре
      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message ai';
        aiMsg.textContent = `Запрос обработан в локальной памяти ATIG: "${text}". Система функционирует в штатном защищенном режиме.`;
        messagesArea.appendChild(aiMsg);
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }, 700);
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  </script>
</body>
</html>
